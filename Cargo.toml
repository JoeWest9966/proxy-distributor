[package]
name = "proxy-distributor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Proxy distribution service (scope TBD)"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
