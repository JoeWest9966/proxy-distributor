<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Proxy Distributor · 项目检测</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🛰️</text></svg>" />
<style>
  :root {
    --bg: #0a0b0e;
    --panel: #111318;
    --panel-2: #171a20;
    --panel-3: #1d2129;
    --line: rgba(225, 235, 255, .10);
    --line-soft: rgba(225, 235, 255, .06);
    --text: #eef0f4;
    --muted: #a8afb8;
    --dim: rgba(238, 240, 244, .5);
    --link: #8b96ff;
    --accent: #6e7bff;
    --accent-soft: rgba(110, 123, 255, .16);
    --ok: #3fdd8b;
    --ok-soft: rgba(63, 221, 139, .12);
    --warn: #f5b544;
    --warn-soft: rgba(245, 181, 68, .13);
    --off: rgba(238, 240, 244, .35);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --dock-h: 76px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 13px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 11, 14, .82);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(140deg, #4f5bff, #8b5cf6);
    display: grid; place-items: center;
    font: 700 11px/1 var(--mono); color: #fff; letter-spacing: .5px;
  }
  .brand b { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .brand span { color: var(--dim); font-size: 12px; }
  .grow { flex: 1; }
  .chips { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line-soft);
    font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .chip b { font-family: var(--mono); color: var(--text); font-weight: 600; }
  .chip.good { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: rgba(110, 123, 255, .55); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  button[aria-pressed="true"] { border-color: rgba(110, 123, 255, .45); color: var(--link); }
  button:disabled { opacity: .45; cursor: default; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 22px calc(var(--dock-h) + 40px); }
  .page { display: none; animation: in .18s ease-out; }
  .page.on { display: block; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .rowhead { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; flex-wrap: wrap; }
  h2 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  h2 small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 8px; }
  .hint { color: var(--dim); font-size: 12px; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px 16px; margin-bottom: 14px;
    transition: border-color .18s;
  }
  .card:hover { border-color: rgba(225, 235, 255, .16); }
  .card.absent { opacity: .62; }
  .card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .card-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .repo { font: 400 11px/1 var(--mono); color: var(--dim); }

  .status {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    font: 600 11px/1 var(--mono); letter-spacing: .6px; text-transform: uppercase;
    padding: 6px 11px; border-radius: 999px;
  }
  .status.running { color: var(--ok); background: var(--ok-soft); }
  .status.running .dot { animation: pulse 2.4s infinite; }
  .status.installed { color: var(--warn); background: var(--warn-soft); }
  .status.absent { color: var(--off); background: var(--panel-3); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63, 221, 139, .5); }
    70% { box-shadow: 0 0 0 7px rgba(63, 221, 139, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 221, 139, 0); }
  }

  .grid { margin-top: 14px; display: grid; grid-template-columns: 84px 1fr; gap: 7px 14px; align-items: start; }
  .grid > dt { color: var(--dim); font: 500 11px/1.7 var(--mono); letter-spacing: .5px; text-transform: uppercase; }
  .grid > dd { margin: 0; min-width: 0; }
  .rows { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .rows + .rows { margin-top: 4px; }

  code, .mono { font-family: var(--mono); font-size: 12px; }
  .path { color: #c9ced8; word-break: break-all; }
  .kind {
    font: 500 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); border: 1px solid var(--line); border-radius: 5px;
    padding: 3px 5px; background: var(--panel-2);
  }
  .sub { color: var(--dim); font: 400 11px/1.6 var(--mono); }

  .port {
    display: inline-flex; align-items: center; gap: 7px;
    font: 600 12px/1 var(--mono);
    background: var(--accent-soft); color: #a3abff;
    padding: 6px 10px; border-radius: 8px;
  }
  .port:hover { background: rgba(110, 123, 255, .26); text-decoration: none; color: #c2c8ff; }
  .port .bind { color: rgba(163, 171, 255, .62); font-weight: 400; }
  .port .src { color: rgba(163, 171, 255, .45); font-weight: 400; font-size: 10px; }

  .svc {
    font: 500 11px/1 var(--mono); padding: 4px 8px; border-radius: 6px;
    background: var(--panel-3); color: var(--muted);
  }
  .svc.on { color: var(--ok); background: var(--ok-soft); }
  .svc.off { color: var(--off); }

  details.rel { margin-top: 8px; }
  details.rel > summary {
    cursor: pointer; list-style: none; user-select: none;
    font: 500 11px/1 var(--mono); color: var(--dim); padding: 5px 0;
  }
  details.rel > summary::-webkit-details-marker { display: none; }
  details.rel > summary::before { content: "▸ "; }
  details.rel[open] > summary::before { content: "▾ "; }
  details.rel > summary:hover { color: var(--muted); }
  details.rel .rows { margin-top: 6px; }
  .proc-rel { color: var(--dim); }
  .proc-rel code { color: var(--muted); }

  .notes { margin: 12px 0 0; padding: 0; list-style: none; }
  .notes li { color: #9aa3b0; font-size: 12.5px; padding-left: 16px; position: relative; }
  .notes li::before { content: "·"; position: absolute; left: 5px; color: var(--dim); }
  .empty-note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  .foot { color: var(--dim); font: 400 11px/1.7 var(--mono); margin-top: 18px; }
  .foot .roots { word-break: break-all; }
  .err { color: #f87a7a; }

  /* ── 底部浮动 dock（视觉照 Exitmap / workbuddy-manager floating-dock，MIT）── */
  .dock {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: flex-end; gap: 10px;
    padding: 8px 12px; border-radius: 16px;
    background: rgba(17, 19, 24, .72);
    border: 1px solid rgba(225, 235, 255, .10);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .45), 0 1px 0 rgba(255, 255, 255, .05) inset;
    backdrop-filter: blur(14px) saturate(1.3);
  }
  .dock-item {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 999px;
    background: var(--panel-3); color: var(--muted); text-decoration: none;
    transition: width .13s cubic-bezier(.2, .8, .2, 1), height .13s cubic-bezier(.2, .8, .2, 1),
                background .15s, color .15s;
    will-change: width, height;
  }
  .dock-item:hover { background: #232833; color: var(--text); text-decoration: none; }
  .dock-item.on { background: var(--accent-soft); color: #8b96ff; }
  .dock-item svg {
    width: 21px; height: 21px; stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    transition: width .13s cubic-bezier(.2, .8, .2, 1), height .13s cubic-bezier(.2, .8, .2, 1);
  }
  .dock-item.on::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: currentColor;
  }
  .tip {
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    padding: 3px 9px; border-radius: 7px; font-size: 11.5px; white-space: nowrap;
    background: #20242c; border: 1px solid var(--line); color: var(--text);
    opacity: 0; pointer-events: none; transition: opacity .13s, transform .13s;
  }
  .dock-item:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .status.running .dot { animation: none; }
    .page { animation: none; }
    .dock-item, .dock-item svg { transition: none; }
  }
  @media (max-width: 720px) {
    header { padding: 11px 14px; }
    .brand span { display: none; }
    main { padding: 16px 14px calc(var(--dock-h) + 30px); }
    .grid { grid-template-columns: 1fr; gap: 2px; }
    .grid > dt { margin-top: 8px; }
    .dock { gap: 7px; padding: 7px 10px; bottom: 12px; }
    .dock-item { width: 40px; height: 40px; }
    .dock-item svg { width: 19px; height: 19px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">PD</div>
    <div>
      <b>Proxy Distributor</b>
      <span id="host">—</span>
    </div>
  </div>
  <span class="grow"></span>
  <div class="chips">
    <span class="chip" id="updated">未扫描</span>
  </div>
  <button id="auto" aria-pressed="true" title="每 5 秒自动刷新">自动刷新 · 开</button>
  <button id="refresh" class="primary">立即刷新</button>
</header>

<main>
  <!-- ① 项目检测 -->
  <section class="page" id="page-detect">
    <div class="rowhead">
      <h2>项目检测<small>本机装了吗 · 装在哪 · 开在哪个端口</small></h2>
      <span class="grow"></span>
      <span class="hint" id="detect-meta"></span>
    </div>
    <div class="summary" id="summary"></div>
    <div id="cards"></div>
    <div class="foot">
      <div>扫描根：<span class="roots" id="roots">—</span></div>
      <div id="meta">—</div>
    </div>
  </section>
</main>

<nav class="dock" id="dock" aria-label="页面切换"></nav>

<script>
const AUTO_MS = 5000;
let timer = null;
let auto = true;
let busy = false;
let last = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── 页面路由：真 URL，不整页刷新 ──────────────────────────────────────────
// 加页面就在这儿加一条，服务端有 SPA 兜底，不用改 Rust。
const PAGES = [
  { path: "/detect", title: "项目检测",
    icon: `<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>` },
];
const resolve = (p) => (PAGES.find((x) => x.path === p) ? p : PAGES[0].path);

function renderDock() {
  const cur = resolve(location.pathname);
  $("#dock").innerHTML = PAGES.map((p) => `
    <a class="dock-item ${p.path === cur ? "on" : ""}" href="${p.path}" data-path="${p.path}"
       aria-label="${p.title}" aria-current="${p.path === cur ? "page" : "false"}">
      ${p.icon}<span class="tip">${p.title}</span>
    </a>`).join("");
}

function show(path, push) {
  const cur = resolve(path);
  for (const p of PAGES) {
    const el = $("#page-" + p.path.slice(1));
    if (el) el.classList.toggle("on", p.path === cur);
  }
  if (push && location.pathname !== cur) history.pushState({}, "", cur);
  renderDock();
  document.title = "Proxy Distributor · " + (PAGES.find((p) => p.path === cur) || PAGES[0]).title;
}

document.addEventListener("click", (ev) => {
  const a = ev.target.closest("a[data-path]");
  if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
  ev.preventDefault();
  show(a.dataset.path, true);
});
window.addEventListener("popstate", () => show(location.pathname, false));

// ── dock 放大：光标离哪项近哪项长大（视觉照 workbuddy-manager，MIT）──────
(() => {
  const dock = $("#dock");
  let raf = 0, lx = null;
  const NEAR = 150, BASE = 44, MAX = 68, IB = 21, IM = 34;
  const apply = () => {
    raf = 0;
    for (const el of dock.children) {
      const svg = el.querySelector("svg");
      if (lx === null) {
        el.style.width = el.style.height = "";
        if (svg) svg.style.width = svg.style.height = "";
        continue;
      }
      const r = el.getBoundingClientRect();
      const d = lx - (r.left + r.width / 2);
      const t = Math.max(0, 1 - Math.abs(d) / NEAR);
      const k = t * t * (3 - 2 * t); // smoothstep
      const size = BASE + (MAX - BASE) * k;
      el.style.width = el.style.height = size + "px";
      if (svg) {
        const is = IB + (IM - IB) * k;
        svg.style.width = svg.style.height = is + "px";
      }
    }
  };
  dock.addEventListener("mousemove", (e) => { lx = e.clientX; if (!raf) raf = requestAnimationFrame(apply); });
  dock.addEventListener("mouseleave", () => { lx = null; if (!raf) raf = requestAnimationFrame(apply); });
})();

// ── 格式化 ────────────────────────────────────────────────────────────────
function rel(ms) {
  if (!ms) return "—";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return `${Math.floor(s)} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  return `${Math.floor(s / 86400)} 天前`;
}

function dur(ms) {
  if (!ms) return "—";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h${Math.floor((s % 3600) / 60)}m`;
  return `${Math.floor(s / 86400)}d${Math.floor((s % 86400) / 3600)}h`;
}

const statusLabel = (s) => ({ running: "running", installed: "installed", absent: "absent" }[s] || s);

function portChip(p) {
  return `<a class="port" href="${esc(p.url || "#")}" target="_blank" rel="noreferrer">
      ${esc(p.port)}<span class="bind">${esc(p.proto)} · ${esc(p.bind)}</span>
      <span class="src">${p.sources.map(esc).join("+")}</span></a>`;
}

function card(p) {
  const direct = p.processes.filter((x) => x.relation !== "related");
  const related = p.processes.filter((x) => x.relation === "related");

  const inst = p.installations.length
    ? p.installations.map((i) => `<div class="rows">
        <span class="kind">${esc(i.kind)}</span>
        <code class="path">${esc(i.path)}</code>
        <span class="sub">${esc(i.detail || "")}${i.modified_ms ? " · " + rel(i.modified_ms) : ""}</span>
      </div>`).join("")
    : `<div class="rows"><span class="sub">未发现安装文件</span></div>`;

  const procs = (direct.length || related.length)
    ? (direct.length
        ? direct.map((x) => `<div class="rows">
            <code>${esc(x.name)}</code>
            <span class="sub">pid ${x.pid} · 已运行 ${dur(x.started_ms)}</span>
          </div>
          <div class="rows"><code class="path">${esc(x.exe || "—")}</code></div>
          <div class="rows"><span class="sub">${esc(x.cmdline)}</span></div>`).join("")
        : `<div class="rows"><span class="sub">没找到本体进程</span></div>`)
      + (related.length
        ? `<details class="rel"><summary>相关进程 · ${related.length} 个 · ${(p.related_ports || []).length} 个端口</summary>
            ${related.map((x) => `<div class="rows proc-rel">
              <code>${esc(x.name)}</code>
              <span class="sub">pid ${x.pid} · ${esc(x.matched_by)} · 已运行 ${dur(x.started_ms)}</span>
              ${(p.related_ports || []).filter((b) => b.pid === x.pid).map(portChip).join("")}
            </div>`).join("")}
          </details>`
        : "")
    : `<div class="rows"><span class="sub">无运行进程</span></div>`;

  const ports = p.ports.length
    ? `<div class="rows">${p.ports.map(portChip).join("")}</div>`
    : `<div class="rows"><span class="sub">无监听端口</span></div>`;

  const svcs = p.services.length
    ? `<div class="rows">${p.services.map((s) =>
        `<span class="svc ${s.active ? "on" : "off"}">${esc(s.unit)} · ${esc(s.state)}</span>`).join("")}</div>`
    : `<div class="rows"><span class="sub">无相关 systemd 单元</span></div>`;

  const notes = p.notes.length
    ? `<ul class="notes">${p.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`
    : "";

  return `<section class="card ${esc(p.status)}">
    <div class="card-head">
      <h3>${esc(p.display_name)}</h3>
      <a class="repo" href="${esc(p.repo_url)}" target="_blank" rel="noreferrer">${esc(p.repo)} ↗</a>
      <span class="status ${esc(p.status)}"><span class="dot"></span>${statusLabel(p.status)}</span>
    </div>
    ${p.status === "absent"
      ? `<p class="empty-note">本机没有检测到 <code>${esc(p.slug)}</code>：没有进程、没有监听端口、扫描根里也没有匹配的安装文件。</p>`
      : `<dl class="grid">
          <dt>端口</dt><dd>${ports}</dd>
          <dt>进程</dt><dd>${procs}</dd>
          <dt>路径</dt><dd>${inst}</dd>
          <dt>服务</dt><dd>${svcs}</dd>
        </dl>`}
    ${notes}
  </section>`;
}

function render(snap) {
  last = snap;
  $("#host").textContent = snap.hostname;
  $("#roots").textContent = snap.scan_roots.join("  ·  ");
  const t = snap.timeline || {};
  const parts = [["proc", t.procs_ms], ["sock", t.sockets_ms], ["path", t.paths_ms], ["svc", t.services_ms]]
    .filter(([, ms]) => ms != null).map(([k, ms]) => `${k} ${ms}`).join(" / ");
  $("#meta").textContent =
    `${snap.projects.length} 个项目 · 扫描 ${snap.took_ms} ms${parts ? "（" + parts + "）" : ""} · 数据 ${new Date(snap.generated_ms).toLocaleTimeString("zh-CN", { hour12: false })}`;

  const counts = { running: 0, installed: 0, absent: 0 };
  snap.projects.forEach((p) => { counts[p.status] = (counts[p.status] || 0) + 1; });
  $("#summary").innerHTML = [
    `<span class="chip"><b>${snap.projects.length}</b> 跟踪中</span>`,
    `<span class="chip good"><span class="dot"></span><b>${counts.running}</b> running</span>`,
    `<span class="chip warn"><span class="dot"></span><b>${counts.installed}</b> installed</span>`,
    `<span class="chip"><b>${counts.absent}</b> absent</span>`,
  ].join("");
  $("#detect-meta").textContent = `${snap.projects.length} 个项目`;
  $("#cards").innerHTML = snap.projects.map(card).join("");
  tick();
}

function tick() {
  if (!last) return;
  const age = Math.max(0, (Date.now() - last.generated_ms) / 1000);
  if (!auto) {
    $("#updated").textContent = `${Math.floor(age)} 秒前 · 已暂停`;
    return;
  }
  const left = Math.max(0, Math.ceil(AUTO_MS / 1000 - age));
  $("#updated").textContent = `${age < 1 ? "刚刚" : Math.floor(age) + " 秒前"} · ${left}s 后刷新`;
}

async function load(force = false) {
  if (busy) return;
  busy = true;
  const btn = $("#refresh");
  btn.disabled = true;
  try {
    const res = await fetch("/api/detect" + (force ? "?refresh=1" : ""), { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (err) {
    $("#updated").innerHTML = `<span class="err">刷新失败：${esc(err.message)}</span>`;
  } finally {
    btn.disabled = false;
    busy = false;
    tick();
  }
}

function setAuto(on) {
  auto = on;
  const btn = $("#auto");
  btn.setAttribute("aria-pressed", String(on));
  btn.textContent = on ? "自动刷新 · 开" : "自动刷新 · 关";
  if (timer) { clearInterval(timer); timer = null; }
  if (on) timer = setInterval(() => load(false), AUTO_MS);
  tick();
}

$("#refresh").addEventListener("click", () => load(true));
$("#auto").addEventListener("click", () => setAuto(!auto));
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });

show(location.pathname, true);
load(true);
setAuto(true);
setInterval(tick, 1000);
</script>
</body>
</html>
